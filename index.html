<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b6b57"><title>地図探検</title><link rel="stylesheet" href="style.css"></head><body><header><div><h1>地図探検</h1><p>地域の地図を見て、考えよう</p></div><button id="home" class="sub">トップ</button></header><main>
<section id="top" class="page active"><div class="hero"><h2>何をする？</h2><div class="entrances"><button data-start="explore">地図で探す<small>施設を見つけて比べる</small></button><button data-start="quiz">地図からクイズ<small>答えを地図で確かめる</small></button></div></div><div class="notice"><b>先生・保護者の方へ</b><p>自宅など個人が特定される場所は、友達に見せたり共有したりしないようにしましょう。入力した振り返りは、この端末内だけに保存されます。</p></div></section>
<section id="app" class="page"><section class="search"><label for="q">場所を検索</label><div><input id="q" placeholder="学校、駅、公園など" autocomplete="off"><button id="search">検索</button></div><div id="suggest" class="suggest"></div><nav id="quick"><button>学校</button><button>駅</button><button>公園</button><button>市役所</button><button>図書館</button></nav></section>
<div class="bar"><strong id="baseName"></strong><span id="status" role="status"></span><button id="reload" class="sub">読み直す</button><button id="switch">地図からクイズ</button></div>
<div class="layout"><section class="mapBox"><div id="map"><div id="tiles"></div><svg id="marks"></svg><div class="compass">北<br>↑</div><div class="controls"><button data-m="zin">＋</button><button data-m="zout">−</button><button data-m="n">↑</button><button data-m="w">←</button><button data-m="e">→</button><button data-m="s">↓</button></div><button id="reset" class="reset">基準地点にもどる</button></div><p class="legend">● 基準地点　―― 500m円　※学校からのまっすぐなきょりです。道を歩くきょりとは違います。</p></section><aside>
<section id="explore"><nav id="filters"></nav><h2>周辺の施設 <small id="count"></small></h2><div id="list"></div><label class="memo">気づいたこと<textarea id="memo" rows="4"></textarea></label></section>
<section id="quiz" hidden><div class="quizLead"><b>地図を見て考えよう</b><p>答えた後は、地図で場所を確かめます。</p></div><div id="quizView"></div></section></aside></div>
<footer><a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">地図：国土地理院 地理院タイル</a> ／ <a href="https://docs.openpoiapi.com/" target="_blank">施設情報：OpenPOI API</a><div id="attr"></div></footer></section></main><script type="module" src="app.js"></script></body></html>
